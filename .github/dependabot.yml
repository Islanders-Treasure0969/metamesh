# Dependabot 設定
# https://docs.github.com/en/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file
#
# 目的: 依存関係 (Python パッケージ + GitHub Actions) を自動的に最新化し、
# 既知の脆弱性 (CVE) を含むバージョンを使い続けないようにする。
# pip ecosystem は uv.lock も合わせて pyproject.toml から推測する。

version: 2
updates:
  # Python dependencies (pyproject.toml ベース)
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: "Asia/Tokyo"
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - python
    commit-message:
      prefix: "deps"
      include: scope
    # major version bump は手動レビューしたいので minor/patch のみまとめる
    groups:
      python-minor-and-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  # GitHub Actions
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: "Asia/Tokyo"
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - github-actions
    commit-message:
      prefix: "ci"
      include: scope
    # actions の SHA pin と整合させるため、PR で SHA も自動更新される
    groups:
      actions-minor-and-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
